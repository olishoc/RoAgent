name: Build Windows Self-Installing Daemon

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag embedded in the daemon, e.g. v3.0.0-rc.8"
        required: false
        default: "dev"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "package.json"
      - "tools/bootstrap-roagent.mjs"
      - "tools/build-roagent.mjs"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build RoAgent executable
        shell: pwsh
        run: |
          $env:STUDIOLINK_TARGET_PLATFORM="win32"
          npm run build:roagent

      - name: Build self-installing daemon executable
        shell: pwsh
        run: |
          cd server
          npm ci
          $env:STUDIOLINK_TARGET_PLATFORM="win32"
          $env:STUDIOLINK_EMBED_ROAGENT_PATH="..\dist\roagent.exe"
          $env:STUDIOLINK_EMBED_ROAGENT_ASSETS_PATH="..\dist"
          $releaseTag = "${{ github.event.inputs.release_tag || 'dev' }}"
          if ($releaseTag -eq "dev") {
            $tagAtHead = git tag --points-at HEAD | Where-Object { $_ -match '^v\d+\.\d+\.\d+' } | Select-Object -First 1
            if ($tagAtHead) { $releaseTag = $tagAtHead }
          }
          $env:STUDIOLINK_RELEASE_TAG=$releaseTag
          $env:STUDIOLINK_COMMIT_SHA="${{ github.sha }}"
          $env:STUDIOLINK_BUILD_TIME=(Get-Date).ToUniversalTime().ToString("o")
          npm run build:exe

      - name: Verify self-install extracts RoAgent
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:STUDIOLINK_AUTO_UPDATE = "false"
          & ".\dist\studiolink-daemon.exe" install --no-autostart
          $roagent = Join-Path $env:LOCALAPPDATA "Programs\StudioLink\roagent\roagent.exe"
          if (!(Test-Path $roagent)) {
            throw "roagent.exe was not extracted to $roagent"
          }
          $darkTheme = Join-Path (Split-Path $roagent) "theme\dark.json"
          if (!(Test-Path $darkTheme)) {
            throw "RoAgent runtime assets were not extracted to $(Split-Path $roagent)"
          }
          $roagentVersion = & $roagent --version
          if ($LASTEXITCODE -ne 0 -or !$roagentVersion) {
            throw "Installed roagent.exe failed its version smoke test"
          }
          $contract = & $roagent --studiolink --studiolink-place-id ci-place --studiolink-place-name "CI Place" --studiolink-daemon-port 45678 --studiolink-auth-token ci-token --studiolink-scripts-dir $env:TEMP --help 2>&1
          if ($LASTEXITCODE -ne 0 -or (($contract -join "`n") -notmatch "--studiolink")) {
            throw "Installed roagent.exe does not implement the StudioLink launch contract"
          }
          & "$env:LOCALAPPDATA\Programs\StudioLink\studiolink-daemon.exe" status
          & "$env:LOCALAPPDATA\Programs\StudioLink\studiolink-daemon.exe" uninstall

      - uses: actions/upload-artifact@v4
        with:
          name: studiolink-daemon-windows-self-installing
          path: dist/studiolink-daemon.exe
