[package]
name = "roagent_mission_control"
version = "0.1.0"
description = "StudioLink Mission Control"
authors = ["RblxAgent"]
edition = "2021"

[lib]
name = "roagent_mission_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }
